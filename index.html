<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Pro 3D Showcase - Animated Tree</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0b0e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 4px 0;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 0.9rem;
            margin: 0;
            color: #8e8e93;
        }
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            transition: opacity 0.5s ease;
            background: rgba(20, 20, 25, 0.8);
            padding: 30px 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #0a84ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>iPad Pro 3D Showcase</h1>
        <p>Interactive GLTF Environment • Click & Drag to Orbit</p>
    </div>
    <div id="loader">
        <div class="spinner"></div>
        <div id="loader-text">Loading 3D Model...</div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Scene setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0e);
        scene.fog = new THREE.FogExp2(0x0b0b0e, 0.035);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 2.5, 6);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;
        controls.minDistance = 2;
        controls.maxDistance = 10;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
        directionalLight.position.set(5, 8, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.bias = -0.0001;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0x88bbff, 1.0);
        fillLight.position.set(-5, 4, -5);
        scene.add(fillLight);

        // Showcase Pedestal & iPad Base Setup
        const floorGeometry = new THREE.CylinderGeometry(4, 4, 0.2, 64);
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x16161a,
            roughness: 0.2,
            metalness: 0.8
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.position.y = -0.1;
        floor.receiveShadow = true;
        scene.add(floor);

        // Minimalist iPad Base Slab
        const ipadGroup = new THREE.Group();
        const bodyGeo = new THREE.BoxGeometry(3.0, 0.06, 2.2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2c2c2e, metalness: 0.9, roughness: 0.15 });
        const ipadBody = new THREE.Mesh(bodyGeo, bodyMat);
        ipadBody.position.set(0, 0.03, 0);
        ipadBody.castShadow = true;
        ipadBody.receiveShadow = true;
        ipadGroup.add(ipadBody);
        scene.add(ipadGroup);

        // Animation mixer and clock
        let mixer;
        const clock = new THREE.Clock();

        // Load GLB Model
        const loader = new GLTFLoader();
        const loaderElement = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');

        loader.load(
            'rigged_animated_cinematic_quality_tree_2.glb',
            (gltf) => {
                const model = gltf.scene;
                model.position.set(0, 0.06, 0);
                model.scale.set(1, 1, 1);
                
                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });

                scene.add(model);

                // Setup skeletal or clip animations if present in the GLB
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(model);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }

                // Fade out loader
                loaderElement.style.opacity = '0';
                setTimeout(() => loaderElement.remove(), 500);
            },
            (xhr) => {
                if (xhr.total) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    loaderText.innerText = `Loading 3D Model... ${percent}%`;
                }
            },
            (error) => {
                console.error('Error loading GLB file:', error);
                loaderText.innerText = 'Model file not found. Ensure .glb is in the same folder.';
                
                // Fallback placeholder object so the scene doesn't stay empty if file is missing
                const fallbackGeo = new THREE.ConeGeometry(0.6, 1.8, 8);
                const fallbackMat = new THREE.MeshStandardMaterial({ color: 0x34c759, roughness: 0.4 });
                const fallbackTree = new THREE.Mesh(fallbackGeo, fallbackMat);
                fallbackTree.position.set(0, 0.96, 0);
                fallbackTree.castShadow = true;
                scene.add(fallbackTree);
                
                setTimeout(() => {
                    loaderElement.style.opacity = '0';
                    setTimeout(() => loaderElement.remove(), 500);
                }, 2000);
            }
        );

        // Window resize handler
        window.addEventListener('resize', onWindowResize);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Render loop
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) {
                mixer.update(delta);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
